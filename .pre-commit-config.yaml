# Run with prek: `prek install` once, then hooks run on commit; `prek run --all-files` runs them all.
exclude: ^tests/fixtures/ # byte-for-byte copy of the real download listing

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # Every tracked file, not only staged ones: CI has nothing staged.
        args:
          - --maxkb=500
          - --enforce-all
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans the staged changes, so it checks nothing in CI, where nothing is staged.
      - id: gitleaks
      # What CI runs instead (`--hook-stage manual gitleaks-history`): every commit there is,
      # which is why CI checks out the full history (fetch-depth: 0).
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the history
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages:
          - manual

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.258.1
    hooks:
      - id: renovate-config-validator
        args:
          - --strict

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.33.1
    hooks:
      - id: zizmor
        # action.yml is the product; audit it with the workflows.
        files: ^(action\.yml|\.github/workflows/.+\.ya?ml)$

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==1.0.0
