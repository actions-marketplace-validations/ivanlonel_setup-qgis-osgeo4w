name: "🏷️ Move major tag"

# Releases are immutable, so vX.Y.Z is a GitHub Release; the major tag (v1) is a plain tag that
# follows the latest non-prerelease of its line. This job runs no repository code.
on:
  release:
    types:
      - published

permissions: {}

jobs:
  move-major-tag:
    name: "🏷️ Move major tag"
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Point the major tag at the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tag '$TAG' is not vX.Y.Z"; exit 1; }
          major="v${BASH_REMATCH[1]}"
          sha="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
          if gh api "repos/$REPO/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$major" -f sha="$sha" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$major" -f sha="$sha" > /dev/null
          fi
          echo "$major -> $sha ($TAG)" | tee -a "$GITHUB_STEP_SUMMARY"
